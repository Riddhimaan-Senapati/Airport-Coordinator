services:
  mongodb:
    image: mongo:8.2
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongodb-init:
    image: mongo:8.2
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/bash
      - -c
      - >-
        mongosh --host mongodb:27017 --quiet --eval
        'try { rs.status() } catch (error) {
        rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]}) }'

  mailpit:
    image: axllent/mailpit:v1.27.10
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  mongodb-data:
